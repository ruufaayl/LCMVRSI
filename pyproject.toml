[project]
name = "lcmvrsi"
version = "0.0.1"
description = "Long-Context Memory, Verifiable Reasoning, and Scalable Intelligence: a research scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rufayl Waseem" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "einops>=0.7",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
viz = [
    "streamlit>=1.33",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tensorboard>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcmvrsi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
